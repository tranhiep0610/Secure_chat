<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Secure Chat</title>
</head>

<body>
    <main class="login-container">
        <h1>Secure Chat</h1>
        <p>Chào mừng bạn đến với ứng dụng chat của nhóm.</p>

        <h2>Đăng nhập</h2>

        <form>
            <div>
                <label for="username">Tên đăng nhập</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Nhập tên đăng nhập"
                    autocomplete="username"
                    required
                >
            </div>

            <div>
                <label for="password">Mật khẩu</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Nhập mật khẩu"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="button" disabled>Đăng nhập</button>
        </form>

        <p>Bản dựng giao diện — chưa kết nối đăng nhập.</p>
    </main>
</body>
</html>
