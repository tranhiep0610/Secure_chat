<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập | Secure Chat</title>

    <!-- Kết nối với hai tệp CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body>
    <main class="auth-card">
        <h1>Secure Chat</h1>
        <p class="subtitle">Dự án ứng dụng chat AES và DES</p>

        <h2>Đăng nhập</h2>

        <form>
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Nhập tên đăng nhập"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Nhập mật khẩu"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="button" disabled>Đăng nhập</button>
        </form>

        <p class="notice">
            Bản dựng giao diện — chức năng đăng nhập đang được phát triển.
        </p>
    </main>
</body>
</html>
